blueprint:
  name: "Stadtbibliothek Wiesbaden: Erinnerung an Rückgabe"
  description: "Erinnert vor Ablauf der Leihfrist der Stadtbibliothek Wiesbaden an die Rückgabe der Medien."
  domain: automation
  input:
    library_sensor:
      name: Bibliotheks-Sensor
      description: "Der Sensor deiner Stadtbibliothek Wiesbaden."
      selector:
        entity:
          integration: wiesbaden_library
          domain: sensor
    days_before:
      name: Tage vorher
      description: "Wie viele Tage vor dem Rückgabedatum soll erinnert werden?"
      default: 2
      selector:
        number:
          min: 0
          max: 7
          step: 1
          unit_of_measurement: Tage
    notify_target:
      name: Benachrichtigungsziel
      description: "Wähle den Benachrichtigungsdienst oder das Gerät aus."
      selector:
        target:
          entity:
            domain: notify

trigger:
  - platform: time
    at: "09:00:00"

condition:
  - condition: template
    value_template: >-
      {% set sensor_state = states(!input library_sensor!) %}
      {% if sensor_state not in ['unavailable', 'unknown', 'none'] and sensor_state %}
        {% set due = sensor_state | as_datetime %}
        {% if due %}
          {% set days = ((due - now()).days) | int %}
          {{ days == !input days_before! }}
        {% else %}
          false
        {% endif %}
      {% else %}
        false
      {% endif %}

action:
  - service: notify.send_message
    target: !input notify_target
    data:
      title: "Stadtbibliothek Wiesbaden"
      message: >-
        Deine ausgeliehenen Medien der Stadtbibliothek Wiesbaden müssen in {{ !input days_before! }} Tagen (am {{ states(!input library_sensor!) }}) zurückgegeben werden!
